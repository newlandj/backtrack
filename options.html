<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Backtrack Options</title>
    <style>
      body {
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1a1a1a;
        width: 320px;
        padding: 16px;
      }
      label {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        cursor: pointer;
      }
      input {
        margin-top: 3px;
      }
      p.hint {
        color: #666;
        margin: 8px 0 0 24px;
        font-size: 12px;
      }
      p.status {
        margin: 12px 0 0;
        font-size: 12px;
        color: #2a7a2a;
        min-height: 14px;
      }
    </style>
  </head>
  <body>
    <label>
      <input type="checkbox" id="global-mode-checkbox" />
      <span>Cycle tabs across all windows (global history)</span>
    </label>
    <p class="hint">
      When unchecked, each window keeps its own separate back/forward history instead.
      Switching this setting resets your current back/forward history.
    </p>
    <p class="status" id="status"></p>
    <script type="module" src="dist/options.js"></script>
  </body>
</html>
